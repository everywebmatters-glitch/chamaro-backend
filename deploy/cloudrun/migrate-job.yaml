# Cloud Run job that applies Prisma migrations (`prisma migrate deploy`). Replace every <PLACEHOLDER>, then:
#   gcloud run jobs replace deploy/cloudrun/migrate-job.yaml --region asia-south1
#   gcloud run jobs execute chamaro-migrate --region asia-south1 --wait
# The proxy runs with --quitquitquit so the job can stop it when migrations finish.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: chamaro-migrate
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: chamaro-backend@project-2e1ca4ee-4c62-4f01-a4c.iam.gserviceaccount.com
          maxRetries: 0
          timeoutSeconds: 600
          containers:
            - name: migrate
              image: asia-south1-docker.pkg.dev/project-2e1ca4ee-4c62-4f01-a4c/chamaro/chamaro-migrate:<TAG>
              command: ["sh", "-c"]
              args:
                - >-
                  until node -e "require('net').connect(3306,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"; do sleep 1; done;
                  npx prisma migrate deploy; status=$?;
                  node -e "fetch('http://127.0.0.1:9091/quitquitquit',{method:'POST'}).catch(()=>{})";
                  exit $status
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: chamaro-database-url
                      key: latest
            - name: cloud-sql-proxy
              image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
              args:
                - --port=3306
                - --quitquitquit
                - --admin-port=9091
                - project-2e1ca4ee-4c62-4f01-a4c:asia-south1:free-trial-first-project
