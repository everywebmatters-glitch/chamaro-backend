# Cloud Run service for the Chamaro API -- a record of the live configuration (exported 2026-10-18) plus APP_BASE_URL.
# Release with `gcloud run deploy --image ...` as in README.md, which keeps every live setting and the traffic split.
# Do NOT `gcloud run services replace` this file without first diffing it against
# `gcloud run services describe chamaro-api --region asia-south1 --format export`: replace drops anything missing here
# and moves 100% of traffic to the new revision.
# The database is reached through Cloud Run's built-in Cloud SQL connection (the cloudsql-instances annotation), so
# DATABASE_URL uses the socket form mysql://user:pass@localhost/db?socket=/cloudsql/<connection name>
# (see src/plugins/prisma.ts). Every secret comes from Secret Manager; no secret value is written here.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chamaro-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/cloudsql-instances: project-2e1ca4ee-4c62-4f01-a4c:asia-south1:free-trial-first-project
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      serviceAccountName: chamaro-backend@project-2e1ca4ee-4c62-4f01-a4c.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: asia-south1-docker.pkg.dev/project-2e1ca4ee-4c62-4f01-a4c/chamaro-images/chamaro-api:<TAG>
          command: ["node"]
          args: ["dist/src/server.js"]
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: NODE_ENV
              value: production
            # Customer storefront for email links (password reset). Never the admin domain.
            - name: APP_BASE_URL
              value: https://chamaro.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: DATABASE_URL
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: JWT_SECRET
                  key: latest
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_ID
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_SECRET
                  key: latest
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_REDIRECT_URI
                  key: latest
            - name: GOOGLE_FRONTEND_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_FRONTEND_CALLBACK_URL
                  key: latest
            # Read only when an email is sent (the Resend client is created lazily), but every email needs both.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: RESEND_API_KEY
                  key: latest
            # The verified sender, Chamaro <no-reply@chamaro.com>. Live since revision chamaro-api-00024-yub.
            - name: RESEND_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: RESEND_FROM_EMAIL_DOMAIN
                  key: "1"
            # Admin and storefront origins (https://admin.chamaro.com, https://chamaro.com, ...).
            - name: CORS_ORIGIN
              valueFrom:
                secretKeyRef:
                  name: CORS_ORIGIN
                  key: latest
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 240
            timeoutSeconds: 240
            failureThreshold: 1
