# Cloud Run service for the Chamaro API. Replace every <PLACEHOLDER>, then:
#   gcloud run services replace deploy/cloudrun/service.yaml --region asia-south1
# The Cloud SQL Auth Proxy runs beside the API and listens on 127.0.0.1:3306, so DATABASE_URL
# points at 127.0.0.1 and config/database-ssl.ts skips client TLS (the proxy encrypts to Cloud SQL).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chamaro-api
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # Start the API only after the proxy reports ready.
        run.googleapis.com/container-dependencies: '{"api":["cloud-sql-proxy"]}'
    spec:
      serviceAccountName: chamaro-backend@project-2e1ca4ee-4c62-4f01-a4c.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/project-2e1ca4ee-4c62-4f01-a4c/chamaro/chamaro-backend:<TAG>
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: CORS_ORIGIN
              value: https://chamaro-admin-477932129337.asia-south1.run.app,https://chamaro-webapp-477932129337.asia-south1.run.app
            - name: GOOGLE_CLIENT_ID
              value: <GOOGLE_CLIENT_ID>
            - name: GOOGLE_REDIRECT_URI
              value: https://chamaro-api-477932129337.asia-south1.run.app/api/v1/auth/google/callback
            - name: GOOGLE_FRONTEND_CALLBACK_URL
              value: https://chamaro-webapp-477932129337.asia-south1.run.app/account/google/callback/
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chamaro-database-url
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chamaro-jwt-secret
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chamaro-google-client-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            failureThreshold: 10
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - --port=3306
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - project-2e1ca4ee-4c62-4f01-a4c:asia-south1:free-trial-first-project
          resources:
            limits:
              cpu: "0.5"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 15
