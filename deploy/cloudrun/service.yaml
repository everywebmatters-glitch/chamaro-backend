# Cloud Run service for the Chamaro API. Replace every <PLACEHOLDER>, then:
#   gcloud run services replace deploy/cloudrun/service.yaml --region asia-south1
# GOOGLE_* and RESEND_* values come from Secret Manager (not literals) so a `services replace` can never revert them.
# The Cloud SQL Auth Proxy runs beside the API and listens on 127.0.0.1:3306, so DATABASE_URL
# points at 127.0.0.1 and config/database-ssl.ts skips client TLS (the proxy encrypts to Cloud SQL).
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chamaro-api
  annotations:
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        # Start the API only after the proxy reports ready.
        run.googleapis.com/container-dependencies: '{"api":["cloud-sql-proxy"]}'
    spec:
      serviceAccountName: chamaro-backend@project-2e1ca4ee-4c62-4f01-a4c.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 60
      containers:
        - name: api
          image: asia-south1-docker.pkg.dev/project-2e1ca4ee-4c62-4f01-a4c/chamaro/chamaro-backend:<TAG>
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: CORS_ORIGIN
              value: https://chamaro-admin-477932129337.asia-south1.run.app,https://chamaro-webapp-477932129337.asia-south1.run.app
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_ID
                  key: latest
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_REDIRECT_URI
                  key: latest
            - name: GOOGLE_FRONTEND_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_FRONTEND_CALLBACK_URL
                  key: latest
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chamaro-database-url
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chamaro-jwt-secret
                  key: latest
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: GOOGLE_CLIENT_SECRET
                  key: latest
            # Read only when an email is sent (the Resend client is created lazily), but every email needs both.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: RESEND_API_KEY
                  key: latest
            - name: RESEND_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: RESEND_FROM_EMAIL
                  key: latest
            # Customer storefront for email links (password reset). Never the admin domain.
            - name: APP_BASE_URL
              value: https://chamaro.com
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 3
            failureThreshold: 10
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.0
          args:
            - --port=3306
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9090
            - project-2e1ca4ee-4c62-4f01-a4c:asia-south1:free-trial-first-project
          resources:
            limits:
              cpu: "0.5"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 2
            failureThreshold: 15
